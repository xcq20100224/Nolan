<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nolan</title>
    <script>
      // 首帧前读取持久化主题（默认亮色），避免暗色用户打开时白闪
      try {
        var t = localStorage.getItem('nolan-theme')
        document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <!-- 兜底底色已迁入 src/index.css 顶部（内联 style 会触发 vite7 构建期 html-proxy bug） -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
